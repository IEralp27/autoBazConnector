name: Build autoBazConnector APK (Redmi 12C)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 8.7 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK lisanslarini onayla
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Debug APK Derle
        run: gradle assembleDebug --stacktrace

      - name: APK Dosyasini Adlandir
        run: cp app/build/outputs/apk/debug/app-debug.apk autoBazConnector-Redmi12C.apk

      - name: autoBazConnector Redmi 12C APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: autoBazConnector-Redmi12C
          path: autoBazConnector-Redmi12C.apk
